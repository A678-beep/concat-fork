# 0.3.2：HSL 八色相通道。每个通道三个旋钮：色相（-100..100 → 转 ±50°）、
# 饱和度（-100..100 → ×0..2）、明度（-100..100 → ×0.5..1.5）。渲染在
# effect.wgsl 里逐带用 hsl_band 做，只动落在该色相带里的像素。
